<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas CRED | Castillo Grande</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-dark: #4f46e5;
            --secondary: #10b981; --warning: #f59e0b;
            --danger: #ef4444; --bg: #f8fafc;
            --card: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
            margin: 0; padding: 20px; color: #1e293b;
            min-height: 100vh; display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 550px;
            background: var(--card); backdrop-filter: blur(10px);
            border-radius: 24px; padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            border: 1px solid white;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { margin: 0; color: var(--primary-dark); font-weight: 800; font-size: 26px; }
        
        /* Alertas */
        .alert-box {
            padding: 15px; border-radius: 16px; font-size: 13px; font-weight: 600;
            margin-bottom: 20px; display: none; align-items: center; gap: 10px;
            animation: slideIn 0.3s ease;
        }
        .alert-info { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .alert-danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

        .form-section { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #f1f5f9; }
        .section-title { font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: block; }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px; }
        input, select {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            border: 2px solid #f1f5f9; font-size: 14px; font-weight: 600;
            transition: 0.2s; box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); outline: none; background: white; }

        /* Historial Local */
        .historial-box {
            background: #f8fafc; border-radius: 16px; padding: 15px;
            margin-bottom: 20px; display: none; border: 1px solid #e2e8f0;
        }
        .historial-item {
            font-size: 12px; display: flex; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid #f1f5f9;
        }

        .btn-submit {
            width: 100%; padding: 16px; background: var(--primary); color: white;
            border: none; border-radius: 16px; font-weight: 800; font-size: 15px;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); background: var(--primary-dark); }
        .btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

        /* Estilo Adicional */
        .badge-adicional {
            display: none; background: #fff7ed; border: 1px solid #ffedd5;
            padding: 12px; border-radius: 12px; margin-top: 10px;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .admin-trigger {
            text-align: center; margin-top: 20px; font-size: 11px;
            color: #94a3b8; cursor: pointer; text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div style="width:60px; height:60px; background:var(--primary); border-radius:18px; margin:0 auto 15px; display:flex; align-items:center; justify-content:center; color:white; font-size:24px;">
            <i class="fa-solid fa-calendar-check"></i>
        </div>
        <h2>Sistema de Citas</h2>
        <p style="font-size: 13px; color: #64748b; font-weight: 600;">C.S. Castillo Grande</p>
    </div>

    <!-- Alert de Inasistencias (Viene del Mapa) -->
    <div id="alertInasistencia" class="alert-box alert-danger">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="inaMsg"></span>
    </div>

    <!-- Historial de Citas del Niño -->
    <div id="boxHistorial" class="historial-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span class="section-title" style="margin:0"><i class="fa-solid fa-clock-rotate-left"></i> Historial Local</span>
            <i class="fa-solid fa-chevron-up" style="cursor:pointer; font-size:12px;" onclick="toggleBox('listaHistorial')"></i>
        </div>
        <div id="listaHistorial"></div>
    </div>

    <form id="citaForm">
        <div class="form-section">
            <span class="section-title">Identificación del Niño</span>
            <div class="input-group">
                <label>DNI DEL NIÑO</label>
                <input type="number" name="DNI" id="dniInput" placeholder="Ingrese 8 dígitos" required>
            </div>
            <div class="input-group">
                <label>NOMBRE COMPLETO</label>
                <input type="text" name="NOMBRE" id="nombreInput" readonly style="background:#f8fafc">
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="input-group">
                    <label>F. NACIMIENTO</label>
                    <input type="text" name="FECHA_NACIMIENTO" id="nacInput" readonly style="background:#f8fafc">
                </div>
                <div class="input-group">
                    <label>CELULAR</label>
                    <input type="text" name="CELULAR" id="telInput" readonly style="background:#f8fafc">
                </div>
            </div>
        </div>

        <div class="form-section">
            <span class="section-title">Detalles de la Cita</span>
            <div class="input-group">
                <label>CONSULTORIO</label>
                <select name="CONSULTORIO" id="consInput">
                    <option value="CRED">🩺 CRED (Control Crecimiento)</option>
                </select>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="input-group">
                    <label>FECHA DE CITA</label>
                    <input type="date" name="FECHA_CITA" id="citaInput" required>
                </div>
                <div class="input-group">
                    <label>TURNO</label>
                    <select name="TURNO" id="turnoInput">
                        <option value="MAÑANA">MAÑANA (18 Cupos)</option>
                        <option value="TARDE">TARDE (6 Cupos)</option>
                    </select>
                </div>
            </div>

            <!-- Registro Adicional -->
            <div id="boxAdicional" class="badge-adicional">
                <label style="display:flex; align-items:center; gap:10px; color:#9a3412; cursor:pointer;">
                    <input type="checkbox" name="ES_ADICIONAL" id="checkAdicional" value="true">
                    <span><b>CUPOS AGOTADOS.</b> Marcar para registrar como adicional.</span>
                </label>
            </div>
        </div>

        <button type="submit" id="btnEnviar" class="btn-submit">CONFIRMAR REGISTRO</button>
    </form>

    <div class="admin-trigger" onclick="abrirModuloAdmin()">⚙️ Configuración Especialidades</div>
</div>

<script>
    const SCRIPT_CITAS = 'https://script.google.com/macros/s/AKfycbyFVk1G2FY5UoW1dUUsxO9ANtcC4po2g5jZy1jRGP27IA2_b9PvqRREXqJX1KdJbJ6BqQ/exec'; 
    const SCRIPT_MAPA = 'https://script.google.com/macros/s/AKfycbzdHC87qNYw0h0Fa6nIu05T8wjXCv20i-PZ1IKEYjdNMxnX8IOZnTGoCAkh9Pnux4gPxw/exec';

    // 1. BUSQUEDA DE NIÑO (MAPA DIT)
    document.getElementById('dniInput').addEventListener('input', async (e) => {
        const dni = e.target.value;
        if(dni.length === 8) {
            limpiarAlerta();
            
            try {
                // Consultar Mapa DIT
                const respMapa = await fetch(SCRIPT_MAPA);
                const dataMapa = await respMapa.json();
                const nino = dataMapa.find(x => x.dniHijo == dni);

                if(nino) {
                    document.getElementById('nombreInput').value = nino.nombreHijo;
                    document.getElementById('nacInput').value = nino.nacimientoHijo;
                    document.getElementById('telInput').value = nino.celular;
                    
                    // Verificar inasistencias
                    let inas = [];
                    if(nino.citaFaltante) inas.push("ANEMIA (" + nino.citaFaltante + ")");
                    if(nino.citaCred) inas.push("CRED (" + nino.citaCred + ")");
                    if(nino.citaVacuna) inas.push("VACUNAS (" + nino.citaVacuna + ")");
                    
                    if(inas.length > 0) {
                        const alertBox = document.getElementById('alertInasistencia');
                        alertBox.style.display = 'flex';
                        document.getElementById('inaMsg').innerText = "INASISTENCIAS EN MAPA DIT: " + inas.join(", ");
                    }
                } else {
                    habilitarManual();
                    alert("Mamita deberá ingresar datos de sus hijos desde casita. Procediendo con ingreso manual.");
                }

                // Consultar Historial Local
                const respHist = await fetch(`${SCRIPT_CITAS}?dni=${dni}`);
                const dataHist = await respHist.json();
                if(dataHist.encontrado) {
                    const list = document.getElementById('listaHistorial');
                    list.innerHTML = '';
                    dataHist.historial.reverse().slice(0,3).forEach(c => {
                        list.innerHTML += `<div class="historial-item"><span>${c.fecha} - ${c.turno}</span> <b>${c.consultorio} (${c.estado})</b></div>`;
                    });
                    document.getElementById('boxHistorial').style.display = 'block';
                }
            } catch(e) { console.log(e); }
        }
    });

    // 2. VALIDACIÓN DE CUPOS DINÁMICA
    const validarCupos = async () => {
        const fecha = document.getElementById('citaInput').value;
        const turno = document.getElementById('turnoInput').value;
        const consultorio = document.getElementById('consInput').value;
        
        if(!fecha || consultorio !== "CRED") return;

        const diaSemana = new Date(fecha).getUTCDay(); // 0=Dom, 6=Sab
        
        // Regla Sábados Tarde
        if(diaSemana === 6 && turno === "TARDE") { // getUTCDay devuelve 6 para sábado si no se ajusta zona
            alert("No hay turno tarde los días sábados.");
            document.getElementById('turnoInput').value = "MAÑANA";
            return;
        }

        const resp = await fetch(`${SCRIPT_CITAS}?validarCupo=true&fecha=${fecha}&turno=${turno}&consultorio=${consultorio}`);
        const data = await resp.json();
        
        const limite = (turno === "MAÑANA") ? 18 : 6;
        
        if(data.ocupados >= limite) {
            document.getElementById('boxAdicional').style.display = 'block';
            document.getElementById('btnEnviar').innerText = "REGISTRAR COMO ADICIONAL";
        } else {
            document.getElementById('boxAdicional').style.display = 'none';
            document.getElementById('btnEnviar').innerText = "CONFIRMAR REGISTRO";
        }
    };

    document.getElementById('citaInput').addEventListener('change', validarCupos);
    document.getElementById('turnoInput').addEventListener('change', validarCupos);

    // 3. MODULO ADMINISTRADOR
    function abrirModuloAdmin() {
        const pass = prompt("Clave Administrador:");
        if(pass === "2026_DIT@") {
            const select = document.getElementById('consInput');
            if(select.options.length === 1) {
                const extras = ["NUTRICIÓN", "ODONTOLOGÍA PEDIATRICA", "PSICOLOGÍA INFANTIL"];
                extras.forEach(e => {
                    let opt = document.createElement("option");
                    opt.value = e; opt.text = "🏥 " + e;
                    select.add(opt);
                });
                alert("Especialidades activadas.");
            }
        } else { alert("Clave incorrecta"); }
    }

    // UTILIDADES
    function habilitarManual() {
        document.getElementById('nombreInput').readOnly = false;
        document.getElementById('nombreInput').style.background = "white";
        document.getElementById('nacInput').type = "date";
        document.getElementById('nacInput').readOnly = false;
        document.getElementById('nacInput').style.background = "white";
        document.getElementById('telInput').readOnly = false;
        document.getElementById('telInput').style.background = "white";
    }

    function toggleBox(id) {
        const el = document.getElementById(id);
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function limpiarAlerta() {
        document.getElementById('alertInasistencia').style.display = 'none';
        document.getElementById('boxHistorial').style.display = 'none';
    }

    // ENVÍO
    document.getElementById('citaForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerText = "PROCESANDO...";

        fetch(SCRIPT_CITAS, { method: 'POST', body: new FormData(this) })
        .then(() => {
            alert("CITA REGISTRADA CON ÉXITO");
            location.reload();
        });
    });
</script>
</body>
</html>
