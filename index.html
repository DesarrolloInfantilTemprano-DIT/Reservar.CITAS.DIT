<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA CRED | C.S. Castillo Grande</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #4f46e5; --accent: #10b981; --warning: #f59e0b; --danger: #ef4444; --bg: #f8fafc; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #1e293b; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: var(--white); width: 100%; max-width: 700px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 25px; }
        h2 { margin: 0; color: var(--primary); font-size: 24px; }
        .status-msg { padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; display: none; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; font-size: 12px; color: #64748b; margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 2px solid #f1f5f9; border-radius: 10px; box-sizing: border-box; font-size: 14px; }
        input:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:disabled { background: #cbd5e1; }
        
        /* Modulos Nuevos */
        .historial-card { background: #f1f5f9; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none; }
        .historial-card h4 { margin: 0 0 10px 0; font-size: 14px; color: #475569; }
        .historial-item { font-size: 12px; padding: 5px 0; border-bottom: 1px solid #e2e8f0; }
        .alert-inasistencia { color: var(--danger); font-weight: bold; font-size: 12px; margin-top: 5px; display: none; }
        .box-adicional { background: #fff7ed; border: 1px solid #ffedd5; padding: 15px; border-radius: 12px; margin-top: 10px; display: none; }
        .admin-btn { background: none; color: #94a3b8; border: 1px solid #e2e8f0; font-size: 11px; padding: 8px; margin-top: 30px; }
        #adminPanel { display: none; background: #fff; border: 2px solid var(--primary); padding: 20px; border-radius: 15px; margin-top: 15px; }

        /* Modal */
        #customModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 300px; }

        @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="customModal">
    <div class="modal-content">
        <i id="modalIcon" style="font-size: 40px; margin-bottom: 15px;"></i>
        <h3 id="modalTitle"></h3>
        <p id="modalMsg"></p>
        <button onclick="closeModal()">ENTENDIDO</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <i class="fa-solid fa-hospital-user" style="font-size: 30px; color: var(--primary);"></i>
        <h2>Registro de Citas CRED</h2>
        <p style="font-size: 12px; color: #64748b;">C.S. CASTILLO GRANDE</p>
    </div>

    <div id="statusBox" class="status-msg"></div>

    <!-- Historial de Citas -->
    <div id="historialNiño" class="historial-card">
        <h4><i class="fa-solid fa-clock-rotate-left"></i> Historial de Citas:</h4>
        <div id="listaHistorial"></div>
    </div>

    <form id="citaForm">
        <div class="form-group">
            <label>DNI del Niño</label>
            <input type="number" name="DNI" id="dniInput" placeholder="Busqueda automática..." required>
            <div id="alertInasistencia" class="alert-inasistencia">⚠️ EL NIÑO REGISTRA INASISTENCIAS EN EL MAPA DIT</div>
        </div>

        <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" name="NOMBRE" id="nombreInput" required>
        </div>

        <div class="grid">
            <div class="form-group">
                <label>F. Nacimiento</label>
                <input type="date" name="FECHA_NACIMIENTO" id="nacInput" required>
            </div>
            <div class="form-group">
                <label>Celular</label>
                <input type="tel" name="CELULAR" id="telInput" required>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #f1f5f9; margin: 15px 0;">

        <div class="grid">
            <div class="form-group">
                <label>Fecha de Cita</label>
                <input type="date" name="FECHA_CITA" id="citaInput" required>
            </div>
            <div class="form-group">
                <label>Turno</label>
                <select name="TURNO" id="turnoInput">
                    <option value="MAÑANA">MAÑANA (Max 18)</option>
                    <option value="TARDE">TARDE (Max 6)</option>
                </select>
            </div>
        </div>

        <!-- Box Adicionales -->
        <div id="boxAdicional" class="box-adicional">
            <label style="color: #9a3412; display: flex; gap: 10px; align-items: center; text-transform: none;">
                <input type="checkbox" id="checkAdicional" name="ES_ADICIONAL" value="true">
                <span><b>CUPOS LLENOS.</b> Registrar como adicional.</span>
            </label>
        </div>

        <div class="form-group">
            <label>Consultorio</label>
            <select name="CONSULTORIO" id="consInput">
                <option value="CRED">CRED</option>
            </select>
        </div>

        <div class="form-group">
            <label>Establecimiento (EESS)</label>
            <input type="text" name="EESS" value="C.S. CASTILLO GRANDE" readonly style="background: #f1f5f9; font-weight: bold;">
        </div>

        <button type="submit" id="btnEnviar">REGISTRAR CITA</button>
    </form>

    <button class="admin-btn" onclick="abrirAdmin()">⚙️ Modulo Especialidades</button>

    <div id="adminPanel">
        <h4 style="margin:0 0 10px 0;">Especialidades Disponibles</h4>
        <div id="checkEspecialidades">
            <label><input type="checkbox" value="NUTRICIÓN"> NUTRICIÓN</label><br>
            <label><input type="checkbox" value="ODONTOLOGÍA PEDIATRICA"> ODONTOLOGÍA PEDIATRICA</label><br>
            <label><input type="checkbox" value="PSICOLOGÍA INFANTIL"> PSICOLOGÍA INFANTIL</label>
        </div>
        <button onclick="aplicarAdmin()" style="padding: 10px; font-size: 12px;">ACTUALIZAR CONSULTORIOS</button>
    </div>
</div>

<script>
    const scriptURL = 'TU_URL_DE_WEB_APP'; // <--- PEGA TU URL DE DESPLIEGUE AQUÍ
    const consultaDniURL = 'https://script.google.com/macros/s/AKfycbx5X6nWXiWlotFSFolBRb1FMZUT_kd5eNwkwxkIXkVY3qGLrwMFynVQCqMaQgJ7dyjYag/exec';
    
    const form = document.getElementById('citaForm');
    const statusBox = document.getElementById('statusBox');

    // --- BUSQUEDA DE DNI Y DATOS ---
    document.getElementById('dniInput').addEventListener('input', async (e) => {
        const dni = e.target.value;
        if(dni.length === 8) {
            statusBox.style.display = 'block';
            statusBox.style.background = '#eff6ff';
            statusBox.innerText = "🔍 Buscando niño...";

            // 1. Consultar si existe en Base Externa
            try {
                const resExt = await fetch(`${consultaDniURL}?dni=${dni}`);
                const dataExt = await resExt.json();
                if(dataExt.encontrado) {
                    document.getElementById('nombreInput').value = dataExt.nombre;
                } else {
                    showModal("AVISO", "Mamita deberá ingresar datos de sus hijos desde casita. Por ahora, ingrese manualmente.", "warning");
                }
            } catch(err) {}

            // 2. Consultar Historial e Inasistencias
            try {
                const resHist = await fetch(`${scriptURL}?dni=${dni}`);
                const dataHist = await resHist.json();
                
                if(dataHist.encontrado && dataHist.historial.length > 0) {
                    const lista = document.getElementById('listaHistorial');
                    lista.innerHTML = "";
                    dataHist.historial.slice(-3).forEach(h => {
                        lista.innerHTML += `<div class="historial-item"><b>${h.fecha}:</b> ${h.consultorio} - ${h.turno} (${h.estado})</div>`;
                    });
                    document.getElementById('historialNiño').style.display = 'block';
                    document.getElementById('alertInasistencia').style.display = 'block'; // Simulación basada en historial previo
                }
            } catch(err) {}
            
            statusBox.style.display = 'none';
        }
    });

    // --- VALIDACIÓN DE CUPOS ---
    const validarCupos = async () => {
        const fecha = document.getElementById('citaInput').value;
        const turno = document.getElementById('turnoInput').value;
        if(!fecha) return;

        const dia = new Date(fecha).getUTCDay(); // 0=Dom, 1=Lun...
        const max = (turno === "MAÑANA") ? 18 : 6;

        // Validar si es Sábado tarde (No permitido según instrucción)
        if(dia === 6 && turno === "TARDE") { // getUTCDay: 6 es Sábado en zona horaria
             showModal("AVISO", "Los días Sábados no contamos con turno tarde.", "warning");
             return;
        }

        const res = await fetch(`${scriptURL}?validarCupo=true&fecha=${fecha}&turno=${turno}`);
        const data = await res.json();

        if(data.ocupados >= max) {
            document.getElementById('boxAdicional').style.display = 'block';
            document.getElementById('btnEnviar').innerText = "REGISTRAR COMO ADICIONAL";
        } else {
            document.getElementById('boxAdicional').style.display = 'none';
            document.getElementById('btnEnviar').innerText = "REGISTRAR CITA";
        }
    };

    document.getElementById('citaInput').addEventListener('change', validarCupos);
    document.getElementById('turnoInput').addEventListener('change', validarCupos);

    // --- MODULO ADMIN ---
    function abrirAdmin() {
        const p = prompt("Clave de Administrador:");
        if(p === "2026_DIT@") {
            document.getElementById('adminPanel').style.display = 'block';
        } else { alert("Clave incorrecta"); }
    }

    function aplicarAdmin() {
        const select = document.getElementById('consInput');
        select.innerHTML = '<option value="CRED">CRED</option>';
        document.querySelectorAll('#checkEspecialidades input:checked').forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.value;
            opt.text = c.value;
            select.add(opt);
        });
        document.getElementById('adminPanel').style.display = 'none';
        showModal("ÉXITO", "Consultorios actualizados correctamente.", "success");
    }

    // --- ENVÍO DE FORMULARIO ---
    form.addEventListener('submit', e => {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerText = "PROCESANDO...";

        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
        .then(() => {
            showModal("REGISTRO EXITOSO", "La cita se ha guardado correctamente.", "success");
            form.reset();
            document.getElementById('historialNiño').style.display = 'none';
            document.getElementById('boxAdicional').style.display = 'none';
            btn.disabled = false;
            btn.innerText = "REGISTRAR CITA";
        });
    });

    // --- MODALES ---
    function showModal(title, msg, type) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalMsg').innerText = msg;
        const icon = document.getElementById('modalIcon');
        icon.className = type === 'success' ? "fa-solid fa-circle-check" : "fa-solid fa-triangle-exclamation";
        icon.style.color = type === 'success' ? "var(--accent)" : "var(--warning)";
        document.getElementById('customModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('customModal').style.display = 'none'; }
</script>
</body>
</html>
